<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5eff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סורק">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>סורק חשבוניות</title>
<style>
@font-face{font-family:GutmannYadBrush;src:url(fonts/gyadbr.ttf) format("truetype")}
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#15181e; --muted:#6b7280; --line:#e3e6ea;
  --brand:#1e5eff; --brand-ink:#fff; --danger:#d93025;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101216; --card:#1a1d23; --ink:#eef0f3; --muted:#9aa3af; --line:#2a2f37; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;height:100%;flex-direction:column}
.screen.on{display:flex}
header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0}
#engine{font-size:12px;color:var(--muted)}
button{font:inherit;border:0;border-radius:12px;padding:14px 18px;background:var(--card);color:var(--ink);
  border:1px solid var(--line);cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button:disabled{opacity:.45}
.bar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.bar button{flex:1}
#grid{flex:1;overflow:auto;padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:12px;align-content:start}
.page{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.page img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff}
.page .n{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;
  font-size:12px;padding:2px 8px}
.page .x{position:absolute;top:4px;left:4px;width:30px;height:30px;padding:0;border-radius:99px;
  background:rgba(0,0,0,.65);color:#fff;border:0;font-size:18px;line-height:30px}
#note{font:inherit;margin:8px 16px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
#hist,#histBack{padding:8px 12px;font-size:14px}
#hlist{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.hrow img{width:48px;height:64px;object-fit:contain;background:#fff;border-radius:4px}
.hrow .ht{flex:1;font-size:14px}
.hrow button{padding:8px 12px;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;background:#0b0c0f}
#stage canvas{touch-action:none;max-width:100%;max-height:100%}
#res{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;background:#0b0c0f}
#res canvas{max-width:100%;max-height:100%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
.chips button{padding:8px 14px;border-radius:99px;white-space:nowrap}
.chips button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.hint{padding:6px 16px;color:var(--muted);font-size:13px;text-align:center}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);color:#fff;display:none;align-items:center;justify-content:center;
  font-size:18px;z-index:9}
#busy.on{display:flex}
#err{color:var(--danger);padding:0 16px;font-size:14px}
</style>
</head>
<body>

<section id="home" class="screen on">
  <header><h1>סורק חשבוניות</h1><span id="engine">טוען מנוע זיהוי…</span><button id="hist">🕘 היסטוריה</button></header>
  <div id="grid"></div>
  <div id="err"></div>
  <input id="note" type="text" maxlength="200" placeholder="הערה לחשבונית (תודפס באדום מעל העמוד הראשון)" autocomplete="off">
  <div class="bar">
    <button id="shoot" class="primary">📷 צלם עמוד</button>
    <button id="pick">🖼 מהגלריה</button>
    <button id="share" disabled>שתף PDF</button>
  </div>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>
  <input id="gal" type="file" accept="image/*" hidden>
</section>

<section id="history" class="screen">
  <header><h1>נשלחו</h1><button id="histBack">חזרה</button></header>
  <div id="hlist"></div>
</section>

<section id="edit" class="screen">
  <header><h1>כוונן את פינות הדף</h1></header>
  <div id="stage"><canvas id="ec"></canvas></div>
  <div class="hint">גרור את העיגולים לפינות הדף</div>
  <div class="bar">
    <button id="editCancel">חזרה</button>
    <button id="editOk" class="primary">חתוך ויישר</button>
  </div>
</section>

<section id="result" class="screen">
  <header><h1>תוצאה</h1></header>
  <div id="res"></div>
  <div class="chips" id="modes">
    <button data-m="color" class="sel">צבעוני</button>
    <button data-m="gray">אפור</button>
    <button data-m="bw">שחור-לבן</button>
    <button data-m="orig">מקורי</button>
    <button id="rot">⟳ סובב</button>
  </div>
  <div class="bar">
    <button id="resBack">חזרה</button>
    <button id="resOk" class="primary">הוסף עמוד</button>
  </div>
</section>

<div id="busy">מעבד…</div>

<script async src="lib/opencv.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
